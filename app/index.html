<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Business Hub</title>
<meta name="description" content="Leads, clients, weddings and money for your NRI care and wedding website business.">
<meta name="theme-color" content="#1f6f54">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="robots" content="noindex">
<script src="../config.js"></script>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2622;--muted:#66736c;--line:#e4dfd4;--brand:#1f6f54;--soft:#e8f2ed;--wed:#8b1e3f;--wedsoft:#f8e9ee;--warn:#b45309;--warnsoft:#fff3e0;--danger:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--card:#1b211e;--ink:#e8ede9;--muted:#9aa8a0;--line:#2c3530;--brand:#4fb08c;--soft:#1f3229;--wed:#e0708f;--wedsoft:#3a2129;--warn:#f0a35a;--warnsoft:#3a2a17;--danger:#f87171}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:1.25rem;margin:0}
main{max-width:720px;margin:0 auto;padding:0 16px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs button{background:none;border:0;padding:8px 0 10px;color:var(--muted);font:inherit;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button span{font-size:1.3rem}
nav.tabs button.on{color:var(--brand);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.82rem}
h2{font-size:1.05rem;margin:18px 0 10px}
h3{font-size:1rem;margin:0}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.wa{background:#25d366}
.btn.wed{background:var(--wed)}
.btn.sm{padding:6px 10px;font-size:.82rem}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--brand)}
.tag.wedding{background:var(--wedsoft);color:var(--wed)}
.tag.due{background:var(--warnsoft);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.35rem}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:.82rem;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.fab{position:fixed;right:18px;bottom:96px;width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;border:0;font-size:1.8rem;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:9}
dialog{border:0;border-radius:18px;padding:0;width:min(560px,94vw);max-height:90vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:18px;overflow:auto;max-height:90vh}
label{display:block;font-size:.82rem;font-weight:600;margin:10px 0 4px;color:var(--muted)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
textarea{min-height:90px}
pre.out{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:.9rem;max-height:45vh;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:.9rem;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.log{font-size:.8rem;color:var(--muted);margin-top:6px;border-left:2px solid var(--line);padding-left:8px}
</style>
</head>
<body>
<header><h1 id="hTitle">Today</h1><span class="small muted" id="hSub"></span></header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="Add">+</button>
<nav class="tabs" id="tabs">
  <button data-t="today" class="on"><span>🏠</span>Today</button>
  <button data-t="leads"><span>🎯</span>Leads</button>
  <button data-t="nri"><span>🌿</span>NRI Care</button>
  <button data-t="wed"><span>💍</span>Weddings</button>
  <button data-t="more"><span>💰</span>Money</button>
</nav>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast"></div>

<script>
/* ---------- config, storage, helpers ---------- */
const C = Object.assign({ownerName:"",city:"",whatsapp:"",brand:"SaathCare",weddingBrand:"Vivah Pages",upi:"",monthlyGoal:66000}, typeof CONFIG!=="undefined"?CONFIG:{});
const KEY = "bizhub.v1";
const blank = () => ({leads:[],nri:[],weddings:[],payments:[]});
let S;
try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e) { S = blank(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) { toast("Couldn't save on this device"); } };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toLocaleDateString("en-CA");
const addDays = (d,n) => { const x = new Date(d+"T12:00:00"); x.setDate(x.getDate()+n); return x.toLocaleDateString("en-CA"); };
const fmtD = d => d ? new Date(d+"T12:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"}) : "";
const inr = n => "₹" + Math.round(+n||0).toLocaleString("en-IN");
const digits = p => String(p||"").replace(/\D/g,"");
const waLink = (phone, text) => "https://wa.me/" + digits(phone) + "?text=" + encodeURIComponent(text);
const $ = id => document.getElementById(id);
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast("Copied ✓"); }catch(e){ toast("Select the text and copy it"); } }

/* ---------- message templates (from the outreach kits) ---------- */
const fill = (t, o={}) => t.replace(/\{(\w+)\}/g, (_,k) => o[k] ?? C[k] ?? "");
const TPL = {
  nri: {
    "First message": "Hi {name}, thanks for checking the Parent Safety Checklist! Are your parents in {city}? If you'd like, I can do a free 20-minute video call with them to check their phone and UPI settings are safe. No obligation.",
    "Follow-up": "Hi {name}, just checking in. Would a free 20-minute safety call with your parents in {city} be useful this week? 🙂",
    "Monthly plan pitch": "It was lovely spending time with your parents today. Everything is set up safely now ✅ Many families keep me on monthly so someone checks in regularly, handles appointments and bills, and sends a Sunday update. ₹2,500/month for 2 visits, or ₹5,000 for 4 with a doctor visit. Shall I start next week?",
    "Ask for referrals": "Thank you so much for trusting me with your parents! 🙏 If you know 2 other people from {city} living abroad who'd want this, I'd be very grateful for an intro. They get the safety setup at ₹1,000 instead of ₹1,500.",
    "Payment request": "Hi {name}, the payment for {plan} is {amount}. UPI: {upi}. For PayPal/Wise, just reply and I'll send the link. Thank you! 🙏"
  },
  wedding: {
    "First message": "Hey {name}! I make wedding websites with all events, venues, dress codes and RSVP on WhatsApp in one link. Here's a demo: {demo}. Is anyone in your family getting married this season? 🙏",
    "Planner / partner": "Hi {name}, I build wedding websites with WhatsApp RSVP and guest travel details. Demo: {demo}. We can white-label it for your clients at ₹2,500, or you earn 20% on every referral. Happy to make one free for your next client. Interested?",
    "Follow-up": "Hi {name}, just following up on the wedding website. When is the first function? I need 48 hours, so I'll keep a slot for you 🙂",
    "Send details list": "Congratulations! 🎉 To build your website, please send: 1) names 2) how you met (3–4 lines or a voice note) 3) each event: date, time, venue + map link, dress code 4) hotel details 5) travel info 6) RSVP WhatsApp number + deadline 7) colour theme 8) hashtag 9) photos (optional) 10) FAQs (kids, gifts, parking).",
    "Payment request": "Great! 50% to start is {amount}. UPI: {upi}. Please send the details and you'll have the first version within 48 hours 🙏"
  }
};
const demoUrl = () => new URL("../weddings/", location.href).href;

function pickTemplate(kind, phone, vars){
  const set = TPL[kind];
  const v = Object.assign({demo: demoUrl(), upi: C.upi, amount: ""}, vars);
  openDlg(`<h3>Send on WhatsApp</h3>
    <label>Template</label><select id="tplSel">${Object.keys(set).map(k=>`<option>${esc(k)}</option>`).join("")}</select>
    <label>Message (edit freely)</label><textarea id="tplTxt" rows="7"></textarea>
    <div class="btns"><a class="btn wa" id="tplGo" target="_blank" rel="noopener">Open WhatsApp</a><button class="btn ghost" id="tplCopy">Copy</button><button class="btn ghost" data-close>Close</button></div>`);
  const upd = () => { $("tplTxt").value = fill(set[$("tplSel").value], v); };
  const link = () => { $("tplGo").href = waLink(phone, $("tplTxt").value); };
  $("tplSel").onchange = () => { upd(); link(); }; $("tplTxt").oninput = link;
  $("tplCopy").onclick = () => copy($("tplTxt").value);
  upd(); link();
}

/* ---------- dialog + generic form ---------- */
function openDlg(html){ $("dlgBody").innerHTML = html; $("dlg").showModal(); $("dlgBody").querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$("dlg").close()); }
$("dlg").addEventListener("click", e => { if (e.target === $("dlg")) $("dlg").close(); });
function form(title, fields, init, onSave, onDelete){
  const f = fields.map(x => {
    const v = esc(init[x.k] ?? x.def ?? "");
    let input;
    if (x.type==="select") input = `<select id="f_${x.k}">${x.options.map(o=>`<option ${String(init[x.k]??x.def)===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    else if (x.type==="textarea") input = `<textarea id="f_${x.k}">${v}</textarea>`;
    else input = `<input id="f_${x.k}" type="${x.type||"text"}" value="${v}" ${x.ph?`placeholder="${esc(x.ph)}"`:""} ${x.req?"required":""}>`;
    return `<label for="f_${x.k}">${esc(x.label)}</label>${input}`;
  }).join("");
  openDlg(`<h3>${esc(title)}</h3><form id="frm">${f}<div class="btns"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" data-close>Cancel</button>${onDelete?`<button class="btn danger" type="button" id="frmDel">Delete</button>`:""}</div></form>`);
  $("frm").onsubmit = e => { e.preventDefault(); const o={}; fields.forEach(x=>{ let v=$("f_"+x.k).value; if(x.type==="number") v=+v||0; o[x.k]=v; }); onSave(o); save(); $("dlg").close(); render(); };
  if (onDelete) $("frmDel").onclick = () => { if (confirm("Delete this? This can't be undone.")) { onDelete(); save(); $("dlg").close(); render(); } };
}

/* ---------- views ---------- */
let tab = "today", leadFilter = "due", openWedding = null, openClient = null;
const STATUSES = ["new","contacted","talking","won","lost"];
const LEAD_FIELDS = [
  {k:"name",label:"Name",req:true},
  {k:"business",label:"For",type:"select",options:["nri","wedding"]},
  {k:"role",label:"Who they are",ph:"NRI in New Jersey / Wedding planner / Bride's sister…"},
  {k:"phone",label:"WhatsApp (with country code)",type:"tel",ph:"+1 555 123 4567"},
  {k:"source",label:"Source",type:"select",options:["Friends & family","Facebook group","Instagram","LinkedIn","Walk-in","Referral","Senior talk","Other"]},
  {k:"status",label:"Status",type:"select",options:STATUSES,def:"new"},
  {k:"nextFollowUp",label:"Next follow-up",type:"date"},
  {k:"value",label:"Possible value (₹)",type:"number"},
  {k:"notes",label:"Notes",type:"textarea"}
];

function leadCard(l){
  const due = l.nextFollowUp && l.nextFollowUp <= today() && !["won","lost"].includes(l.status);
  const last = (l.log||[]).slice(-1)[0];
  return `<div class="card">
    <div class="row"><h3>${esc(l.name)}</h3><span class="tag ${l.business}">${l.business==="nri"?"NRI":"Wedding"}</span></div>
    <div class="small muted">${esc(l.role||"")}${l.source?" · "+esc(l.source):""}</div>
    <div class="small" style="margin-top:6px">Status: <b>${esc(l.status)}</b>${l.nextFollowUp?` · follow up ${fmtD(l.nextFollowUp)}`:""} ${due?'<span class="tag due">due</span>':""}${l.value?` · ${inr(l.value)}`:""}</div>
    ${last?`<div class="log">${fmtD(last.d)}: ${esc(last.t)}</div>`:""}
    <div class="btns">
      ${l.phone?`<button class="btn wa sm" data-wa="${l.id}">💬 Message</button>`:""}
      ${!["won","lost"].includes(l.status)?`<button class="btn ghost sm" data-done="${l.id}">✓ Contacted</button>`:""}
      <button class="btn ghost sm" data-edit="${l.id}">Edit</button>
    </div></div>`;
}
function bindLeads(){
  document.querySelectorAll("[data-wa]").forEach(b=>b.onclick=()=>{ const l=S.leads.find(x=>x.id===b.dataset.wa); pickTemplate(l.business,l.phone,{name:l.name.split(" ")[0]}); });
  document.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{
    const l=S.leads.find(x=>x.id===b.dataset.done);
    const n=(l.log||[]).filter(x=>x.t.startsWith("Contacted")).length;
    l.log=[...(l.log||[]),{d:today(),t:`Contacted (#${n+1})`}];
    if(l.status==="new") l.status="contacted";
    l.nextFollowUp = n>=2 ? "" : addDays(today(), n===0?2:3);
    save(); render(); toast(l.nextFollowUp?`Next follow-up ${fmtD(l.nextFollowUp)}`:"3 touches done. Moving on.");
  });
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editLead(S.leads.find(x=>x.id===b.dataset.edit)));
}
function editLead(l){
  const isNew=!l; l = l || {id:uid(),created:today(),log:[],nextFollowUp:today(),business:"nri"};
  form(isNew?"New lead":"Edit lead", LEAD_FIELDS, l, o=>{ Object.assign(l,o); if(isNew) S.leads.push(l); }, isNew?null:()=>{ S.leads=S.leads.filter(x=>x!==l); });
}

function monthPaid(prefix){ return S.payments.filter(p=>p.date.startsWith(prefix)).reduce((a,p)=>a+(+p.amount||0),0); }

const views = {
  today(){
    const m = today().slice(0,7), paid = monthPaid(m), goal = +C.monthlyGoal||1;
    const contactedToday = S.leads.filter(l=>(l.log||[]).some(x=>x.d===today())).length + S.leads.filter(l=>l.created===today() && !(l.log||[]).length).length;
    const due = S.leads.filter(l=>l.nextFollowUp && l.nextFollowUp<=today() && !["won","lost"].includes(l.status)).sort((a,b)=>a.nextFollowUp.localeCompare(b.nextFollowUp));
    const upcoming = S.weddings.filter(w=>w.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);
    const activeNri = S.nri.filter(c=>c.active!=="no");
    const isSun = new Date().getDay()===0;
    $("hSub").textContent = new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"short"});
    const needsSetup = !C.whatsapp || /^9?1?0+$/.test(C.whatsapp);
    return `
      ${needsSetup?`<div class="card" style="border-color:var(--warn)"><b>⚙️ Add your details first</b><div class="small muted">Open <b>config.js</b> in the website folder and add your name, city, WhatsApp and UPI. Every page and template uses them.</div></div>`:""}
      <div class="card"><div class="row"><b>This month</b><span class="small muted">goal ${inr(goal)}</span></div>
        <div style="font-size:1.8rem;font-weight:700">${inr(paid)}</div>
        <div class="bar"><i style="width:${Math.min(100,paid/goal*100)}%"></i></div></div>
      <div class="stats">
        <div class="stat"><b>${contactedToday}<span class="small muted">/25</span></b><span class="small muted">touched today</span></div>
        <div class="stat"><b>${S.leads.filter(l=>l.status==="talking").length}</b><span class="small muted">in talks</span></div>
        <div class="stat"><b>${S.leads.filter(l=>l.status==="won").length}</b><span class="small muted">won</span></div>
      </div>
      ${isSun && activeNri.length?`<div class="card" style="border-color:var(--brand)"><b>🌿 Sunday: send weekly reports</b><div class="small muted">${activeNri.length} famil${activeNri.length>1?"ies are":"y is"} waiting. Open NRI Care → Weekly report.</div></div>`:""}
      <h2>Follow-ups due (${due.length})</h2>
      ${due.length?due.map(leadCard).join(""):`<div class="empty">Nothing due 🎉 Add new leads with the + button.</div>`}
      ${upcoming.length?`<h2>Upcoming weddings</h2>${upcoming.map(w=>`<div class="card"><div class="row"><b>${esc(w.couple)}</b><span class="tag wedding">${fmtD(w.date)}</span></div><div class="small muted">${esc(w.pkg)} · ${esc(w.status)}</div></div>`).join("")}`:""}`;
  },
  leads(){
    const f = {due:l=>l.nextFollowUp&&l.nextFollowUp<=today()&&!["won","lost"].includes(l.status), all:()=>true, nri:l=>l.business==="nri", wedding:l=>l.business==="wedding", ...Object.fromEntries(STATUSES.map(s=>[s,l=>l.status===s]))};
    const list = S.leads.filter(f[leadFilter]).sort((a,b)=>(a.nextFollowUp||"9").localeCompare(b.nextFollowUp||"9"));
    $("hSub").textContent = `${S.leads.length} total`;
    return `<div class="filters">${["due","all","nri","wedding",...STATUSES].map(k=>`<button class="chip ${k===leadFilter?"on":""}" data-f="${k}">${k}</button>`).join("")}</div>
      ${list.length?list.map(leadCard).join(""):`<div class="empty">No leads here yet.<br>Tap + to add someone you'll contact today.</div>`}`;
  },
  nri(){
    if (openClient) return nriDetail(S.nri.find(c=>c.id===openClient));
    $("hSub").textContent = `${S.nri.filter(c=>c.active!=="no").length} active`;
    const mrr = S.nri.filter(c=>c.active!=="no" && c.plan!=="Digital Safety Setup").reduce((a,c)=>a+(+c.fee||0),0);
    return `<div class="card"><div class="row"><b>Monthly recurring</b><b>${inr(mrr)}</b></div></div>
      ${S.nri.length?S.nri.map(c=>{ const last=(c.visits||[]).slice(-1)[0]; return `<div class="card" data-open="${c.id}" style="cursor:pointer">
        <div class="row"><h3>${esc(c.parents)}</h3><span class="tag">${esc(c.plan)}</span></div>
        <div class="small muted">Child: ${esc(c.childName)} (${esc(c.country)}) · ${inr(c.fee)}${c.plan==="Digital Safety Setup"?"":"/mo"}</div>
        <div class="small">${last?`Last visit ${fmtD(last.date)}`:"No visits yet"}${c.active==="no"?" · <b>inactive</b>":""}</div></div>`; }).join(""):`<div class="empty">No NRI clients yet.<br>Tap + after your first safety setup.</div>`}`;
  },
  wed(){
    if (openWedding) return wedDetail(S.weddings.find(w=>w.id===openWedding));
    $("hSub").textContent = `${S.weddings.length} projects`;
    return S.weddings.length ? S.weddings.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(w=>{
      const paid=S.payments.filter(p=>p.ref===w.id).reduce((a,p)=>a+(+p.amount||0),0);
      return `<div class="card" data-open="${w.id}" style="cursor:pointer"><div class="row"><h3>${esc(w.couple)}</h3><span class="tag wedding">${fmtD(w.date)}</span></div>
      <div class="small muted">${esc(w.pkg)} · ${esc(w.status)}</div>
      <div class="small">Paid ${inr(paid)} of ${inr(w.price)} · ${(w.guests||[]).length} RSVPs</div></div>`; }).join("")
      : `<div class="empty">No wedding projects yet.<br>Tap + when a couple pays the deposit.</div>`;
  },
  more(){
    const m = today().slice(0,7);
    $("hSub").textContent = "";
    const byBiz = b => S.payments.filter(p=>p.business===b).reduce((a,p)=>a+(+p.amount||0),0);
    return `<div class="stats"><div class="stat"><b>${inr(monthPaid(m))}</b><span class="small muted">this month</span></div><div class="stat"><b>${inr(byBiz("nri"))}</b><span class="small muted">NRI total</span></div><div class="stat"><b>${inr(byBiz("wedding"))}</b><span class="small muted">Wedding total</span></div></div>
      <h2>Payments received</h2>
      ${S.payments.length?`<div class="card"><table><tr><th>Date</th><th>From</th><th>Amount</th><th></th></tr>${S.payments.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<tr><td>${fmtD(p.date)}</td><td>${esc(p.from)}<div class="small muted">${esc(p.note||"")}</div></td><td><b>${inr(p.amount)}</b></td><td><button class="btn ghost sm" data-pay="${p.id}">Edit</button></td></tr>`).join("")}</table></div>`:`<div class="empty">No payments yet. Tap + when money arrives.</div>`}
      <h2>Backup & settings</h2>
      <div class="card small">Your data is saved <b>only in this browser on this device</b>. Download a backup every week, and to move to a new phone, restore it there.
        <div class="btns"><button class="btn sm" id="bkDown">⬇ Download backup</button><label class="btn ghost sm" style="margin:0;color:var(--brand)">⬆ Restore<input type="file" id="bkUp" accept=".json" hidden></label><button class="btn danger sm" id="bkReset">Erase all</button></div></div>
      <div class="card small muted">Install on your phone: open this page in Chrome → menu ⋮ → <b>Add to Home screen</b>. On iPhone: Safari → Share → <b>Add to Home Screen</b>.</div>`;
  }
};

function payForm(p, preset={}){
  const isNew=!p; p = p || Object.assign({id:uid(),date:today()},preset);
  form(isNew?"Payment received":"Edit payment",[
    {k:"date",label:"Date",type:"date",req:true},{k:"amount",label:"Amount (₹)",type:"number",req:true},
    {k:"from",label:"From",req:true},{k:"business",label:"Business",type:"select",options:["nri","wedding"]},
    {k:"note",label:"Note",ph:"50% deposit / November plan…"}], p,
    o=>{ Object.assign(p,o); if(isNew) S.payments.push(p); }, isNew?null:()=>{ S.payments=S.payments.filter(x=>x!==p); });
}

/* ---------- NRI client detail + weekly report ---------- */
const NRI_FIELDS = [
  {k:"parents",label:"Parent(s)",req:true,ph:"Amma & Appa (Lakshmi & Raghavan)"},{k:"address",label:"Address / area"},
  {k:"childName",label:"Child abroad",req:true},{k:"childPhone",label:"Child's WhatsApp",type:"tel"},{k:"country",label:"Country"},
  {k:"parentPhone",label:"Parents' phone",type:"tel"},
  {k:"plan",label:"Plan",type:"select",options:["Digital Safety Setup","Basic Care","Full Care"]},{k:"fee",label:"Fee (₹)",type:"number"},
  {k:"startDate",label:"Start date",type:"date"},{k:"active",label:"Active",type:"select",options:["yes","no"]},
  {k:"meds",label:"Medicines & refill dates",type:"textarea"},{k:"notes",label:"Doctors, bank, important notes",type:"textarea"}];
function nriDetail(c){
  if(!c){ openClient=null; return views.nri(); }
  $("hSub").textContent = c.childName;
  const v=(c.visits||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  return `<button class="btn ghost sm" id="back">← All clients</button>
    <div class="card" style="margin-top:10px"><div class="row"><h3>${esc(c.parents)}</h3><span class="tag">${esc(c.plan)}</span></div>
      <div class="small muted">${esc(c.address||"")}</div>
      <div class="small">Child: <b>${esc(c.childName)}</b> · ${esc(c.country||"")} · ${inr(c.fee)}</div>
      ${c.meds?`<div class="log">💊 ${esc(c.meds)}</div>`:""}${c.notes?`<div class="log">📝 ${esc(c.notes)}</div>`:""}
      <div class="btns"><button class="btn sm" id="addVisit">+ Visit</button><button class="btn sm" id="report">📋 Weekly report</button>
      ${c.childPhone?`<button class="btn wa sm" id="msgChild">💬 Child</button>`:""}<button class="btn ghost sm" id="payC">₹ Payment</button><button class="btn ghost sm" id="editC">Edit</button></div></div>
    <h2>Visits (${v.length})</h2>
    ${v.length?v.map(x=>`<div class="card"><div class="row"><b>${fmtD(x.date)}</b><span class="small muted">${esc(x.time||"")}</span></div><div class="small" style="white-space:pre-wrap">${esc(x.notes)}</div>${x.next?`<div class="log">Next: ${esc(x.next)}</div>`:""}<div class="btns"><button class="btn ghost sm" data-v="${x.id}">Edit</button></div></div>`).join(""):`<div class="empty">Log every visit. The weekly report is built from these notes.</div>`}`;
}
function visitForm(c, x){
  const isNew=!x; x = x || {id:uid(),date:today()};
  form(isNew?"Log visit":"Edit visit",[
    {k:"date",label:"Date",type:"date",req:true},{k:"time",label:"Time",ph:"10:30–11:30"},
    {k:"mood",label:"How they are",ph:"Both cheerful, Amma's knee better"},
    {k:"notes",label:"What you did (one per line)",type:"textarea",req:true,ph:"Refilled BP medicines\nPaid electricity bill ₹1,840 (Appa paid on his phone)\nBlocked 2 scam calls"},
    {k:"safety",label:"Safety notes",ph:"Got a fake KYC SMS, deleted it 👍"},
    {k:"next",label:"Coming up / next",ph:"Cardiology follow-up Thu 11:00"},
    {k:"ask",label:"Needs family's OK",ph:"Buy pill organiser ₹250?"}], x,
    o=>{ Object.assign(x,o); if(isNew){ c.visits=[...(c.visits||[]),x]; } },
    isNew?null:()=>{ c.visits=c.visits.filter(y=>y!==x); });
}
function weeklyReport(c){
  const from = addDays(today(),-7);
  const vs=(c.visits||[]).filter(v=>v.date>from).sort((a,b)=>a.date.localeCompare(b.date));
  const lines = a => a.filter(Boolean).map(s=>"• "+s).join("\n");
  const done = vs.flatMap(v=>String(v.notes||"").split("\n").map(s=>s.trim()).filter(Boolean));
  const text = `🌿 Weekly update: ${c.parents} · ${fmtD(addDays(today(),-6))}–${fmtD(today())}

👋 Visits: ${vs.length?vs.map(v=>fmtD(v.date)+(v.time?" "+v.time:"")).join(", "):"No visit this week"}
😊 How they are: ${vs.map(v=>v.mood).filter(Boolean).slice(-1)[0]||"Doing well"}

✅ Done this week
${lines(done)||"• —"}

🛡️ Safety
${lines(vs.map(v=>v.safety))||"• All good, no suspicious calls or messages reported"}

📅 Coming up
${lines(vs.map(v=>v.next))||"• —"}
${vs.some(v=>v.ask)?`\n❓ Need your OK on\n${lines(vs.map(v=>v.ask))}\n`:""}
— ${C.ownerName||""}, ${C.brand}`;
  openDlg(`<h3>Weekly report: ${esc(c.childName)}</h3><p class="small muted">Built from the last 7 days of visits. Edit, then send with photos.</p>
    <textarea id="rep" rows="14">${esc(text)}</textarea>
    <div class="btns">${c.childPhone?`<a class="btn wa" id="repGo" target="_blank" rel="noopener">Send on WhatsApp</a>`:""}<button class="btn ghost" id="repCopy">Copy</button><button class="btn ghost" data-close>Close</button></div>`);
  const link=()=>{ if($("repGo")) $("repGo").href=waLink(c.childPhone,$("rep").value); };
  $("rep").oninput=link; link(); $("repCopy").onclick=()=>copy($("rep").value);
}

/* ---------- Wedding detail + RSVP tracker ---------- */
const WED_FIELDS = [
  {k:"couple",label:"Couple",req:true,ph:"Aanya & Vihaan"},{k:"contact",label:"Contact person"},{k:"phone",label:"Contact WhatsApp",type:"tel"},
  {k:"date",label:"Main wedding date",type:"date"},{k:"pkg",label:"Package",type:"select",options:["Website","Website + RSVP Desk","Destination Concierge","White-label (planner)"]},
  {k:"price",label:"Price (₹)",type:"number"},{k:"status",label:"Status",type:"select",options:["Deposit paid","Collecting details","Building","Sent for review","Live","Done"]},
  {k:"siteUrl",label:"Live site link",type:"url",ph:"https://…"},{k:"events",label:"Event names (comma separated)",ph:"Haldi, Mehendi, Sangeet, Wedding, Reception"},
  {k:"notes",label:"Notes",type:"textarea"}];
function parseRsvp(txt){
  const g = k => { const m = txt.match(new RegExp("^\\s*"+k+"\\s*:\\s*(.+)$","im")); return m?m[1].trim():""; };
  return {name:g("Name"), count:parseInt(g("Guests"))||1, events:g("Events"), meal:g("Meal"), arrival:g("Arrival"), room:g("Hotel room needed"), msg:g("Message")};
}
function wedDetail(w){
  if(!w){ openWedding=null; return views.wed(); }
  $("hSub").textContent = fmtD(w.date);
  const gs=w.guests||[], paid=S.payments.filter(p=>p.ref===w.id).reduce((a,p)=>a+(+p.amount||0),0);
  const evs=(w.events||"").split(",").map(s=>s.trim()).filter(Boolean);
  const heads=gs.reduce((a,x)=>a+(+x.count||0),0);
  const per=evs.map(e=>[e,gs.filter(x=>(x.events||"").toLowerCase().includes(e.toLowerCase())).reduce((a,x)=>a+(+x.count||0),0)]);
  const meals={}; gs.forEach(x=>{ if(x.meal) meals[x.meal]=(meals[x.meal]||0)+(+x.count||0); });
  const rooms=gs.filter(x=>/^yes/i.test(x.room||"")).length;
  return `<button class="btn ghost sm" id="back">← All weddings</button>
    <div class="card" style="margin-top:10px"><div class="row"><h3>${esc(w.couple)}</h3><span class="tag wedding">${esc(w.status)}</span></div>
      <div class="small muted">${esc(w.pkg)} · ${fmtD(w.date)} · ${esc(w.contact||"")}</div>
      <div class="small">Paid <b>${inr(paid)}</b> of ${inr(w.price)}${paid<w.price?` · <span class="tag due">${inr(w.price-paid)} due</span>`:" ✅"}</div>
      ${w.siteUrl?`<div class="small"><a href="${esc(w.siteUrl)}" target="_blank" rel="noopener">${esc(w.siteUrl)}</a></div>`:""}
      <div class="btns">${w.phone?`<button class="btn wa sm" id="msgW">💬 Message</button>`:""}<button class="btn ghost sm" id="payW">₹ Payment</button><button class="btn ghost sm" id="editW">Edit</button></div></div>
    <h2>RSVPs: ${gs.length} replies · ${heads} guests</h2>
    <div class="card"><label for="rsvpIn" style="margin-top:0">Paste an RSVP WhatsApp message from the website</label><textarea id="rsvpIn" placeholder="RSVP for … Name: … Guests: … Events: …"></textarea>
      <div class="btns"><button class="btn wed sm" id="rsvpAdd">+ Add RSVP</button><button class="btn ghost sm" id="rsvpManual">Add manually</button>${gs.length?`<button class="btn ghost sm" id="rsvpCsv">⬇ CSV</button><button class="btn ghost sm" id="rsvpSum">📋 Summary</button>`:""}</div></div>
    ${gs.length?`<div class="card small"><b>Headcount per event</b><table>${per.map(([e,n])=>`<tr><td>${esc(e)}</td><td><b>${n}</b></td></tr>`).join("")||"<tr><td class='muted'>Add event names in Edit to see per-event counts</td></tr>"}</table>
      <div style="margin-top:8px"><b>Meals:</b> ${Object.entries(meals).map(([k,n])=>`${esc(k)} ${n}`).join(" · ")||"—"} · <b>Rooms needed:</b> ${rooms}</div></div>
      <div class="card"><table><tr><th>Name</th><th>#</th><th>Arrival</th><th></th></tr>${gs.map(x=>`<tr><td>${esc(x.name)}<div class="small muted">${esc(x.meal||"")}${x.room?" · room: "+esc(x.room):""}</div></td><td>${esc(x.count)}</td><td class="small">${esc(x.arrival||"")}</td><td><button class="btn ghost sm" data-g="${x.id}">Edit</button></td></tr>`).join("")}</table></div>`:""}`;
}
const GUEST_FIELDS=[{k:"name",label:"Name",req:true},{k:"count",label:"Guests",type:"number"},{k:"events",label:"Events"},{k:"meal",label:"Meal"},{k:"arrival",label:"Arrival"},{k:"room",label:"Hotel room needed"},{k:"phone",label:"Phone",type:"tel"},{k:"msg",label:"Message",type:"textarea"}];
function guestForm(w,x){ const isNew=!x; x=x||{id:uid(),count:1}; form(isNew?"Add guest":"Edit guest",GUEST_FIELDS,x,o=>{Object.assign(x,o); if(isNew) w.guests=[...(w.guests||[]),x];}, isNew?null:()=>{ w.guests=w.guests.filter(y=>y!==x); }); }
function csv(rows){ return rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n"); }
function download(name, text, type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }

/* ---------- render + wiring ---------- */
const TITLES={today:"Today",leads:"Leads",nri:"NRI Care",wed:"Weddings",more:"Money"};
function render(){
  $("hTitle").textContent = TITLES[tab];
  $("view").innerHTML = views[tab]();
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  bindLeads();
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ leadFilter=b.dataset.f; render(); });
  document.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>payForm(S.payments.find(p=>p.id===b.dataset.pay)));
  if(tab==="nri"){
    document.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>{ openClient=el.dataset.open; render(); });
    const c=S.nri.find(x=>x.id===openClient);
    if(c){
      $("back").onclick=()=>{ openClient=null; render(); };
      $("addVisit").onclick=()=>visitForm(c); $("report").onclick=()=>weeklyReport(c);
      $("editC").onclick=()=>form("Edit client",NRI_FIELDS,c,o=>Object.assign(c,o),()=>{ S.nri=S.nri.filter(x=>x!==c); openClient=null; });
      $("payC").onclick=()=>payForm(null,{from:c.childName,business:"nri",amount:c.fee,ref:c.id});
      if($("msgChild")) $("msgChild").onclick=()=>pickTemplate("nri",c.childPhone,{name:c.childName.split(" ")[0],plan:c.plan,amount:inr(c.fee)});
      document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>visitForm(c,c.visits.find(v=>v.id===b.dataset.v)));
    }
  }
  if(tab==="wed"){
    document.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>{ openWedding=el.dataset.open; render(); });
    const w=S.weddings.find(x=>x.id===openWedding);
    if(w){
      $("back").onclick=()=>{ openWedding=null; render(); };
      $("editW").onclick=()=>form("Edit wedding",WED_FIELDS,w,o=>Object.assign(w,o),()=>{ S.weddings=S.weddings.filter(x=>x!==w); openWedding=null; });
      $("payW").onclick=()=>payForm(null,{from:w.contact||w.couple,business:"wedding",amount:Math.round((+w.price||0)/2),ref:w.id,note:"50% payment"});
      if($("msgW")) $("msgW").onclick=()=>pickTemplate("wedding",w.phone,{name:(w.contact||w.couple).split(" ")[0],amount:inr((+w.price||0)/2)});
      $("rsvpAdd").onclick=()=>{ const r=parseRsvp($("rsvpIn").value); if(!r.name){ toast("Couldn't find 'Name:' in that message"); return; } w.guests=[...(w.guests||[]),{id:uid(),...r}]; save(); render(); toast("RSVP added ✓"); };
      $("rsvpManual").onclick=()=>guestForm(w);
      document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>guestForm(w,w.guests.find(g=>g.id===b.dataset.g)));
      if($("rsvpCsv")) $("rsvpCsv").onclick=()=>download(w.couple.replace(/\W+/g,"-")+"-rsvps.csv",csv([["Name","Guests","Events","Meal","Arrival","Room","Phone","Message"],...w.guests.map(x=>[x.name,x.count,x.events,x.meal,x.arrival,x.room,x.phone,x.msg])]),"text/csv");
      if($("rsvpSum")) $("rsvpSum").onclick=()=>{ const t=$("view").querySelectorAll(".card")[2]?.innerText||""; openDlg(`<h3>Summary for the family</h3><pre class="out">${esc(`RSVP update: ${w.couple}\n${w.guests.length} replies · ${w.guests.reduce((a,x)=>a+(+x.count||0),0)} guests\n\n`+t)}</pre><div class="btns"><button class="btn" id="sumCopy">Copy</button><button class="btn ghost" data-close>Close</button></div>`); $("sumCopy").onclick=()=>copy($("dlgBody").querySelector("pre").innerText); };
    }
  }
  if(tab==="more"){
    $("bkDown").onclick=()=>download(`business-hub-backup-${today()}.json`,JSON.stringify(S,null,2),"application/json");
    $("bkUp").onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{ try{ const d=JSON.parse(t); if(!confirm("Replace everything on this device with this backup?")) return; S=Object.assign(blank(),d); save(); render(); toast("Restored ✓"); }catch(err){ toast("That file isn't a valid backup"); } }); };
    $("bkReset").onclick=()=>{ if(confirm("Erase ALL data on this device? Download a backup first!") && confirm("Really erase everything?")){ S=blank(); save(); render(); } };
  }
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{ tab=b.dataset.t; openClient=null; openWedding=null; render(); window.scrollTo(0,0); });
$("fab").onclick=()=>{
  if(tab==="nri") return form("New NRI client",NRI_FIELDS,{plan:"Digital Safety Setup",fee:1500,active:"yes",startDate:today()},o=>S.nri.push({id:uid(),visits:[],...o}));
  if(tab==="wed") return form("New wedding project",WED_FIELDS,{pkg:"Website",price:3999,status:"Deposit paid"},o=>S.weddings.push({id:uid(),guests:[],...o}));
  if(tab==="more") return payForm();
  editLead();
};
render();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
