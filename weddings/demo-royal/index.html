<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding</title>
<meta name="description" content="Our wedding celebrations, with events, venues, travel and RSVP.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<!-- All wedding details live in data.js. Edit that file only. -->
<script src="../../config.js"></script>
<script src="data.js"></script>
<style>
:root{
  --bg:#fff8f0; --surface:#ffffff; --ink:#3b1f1a; --muted:#7a5a52;
  --primary:#8b1e3f; --primary-ink:#fff; --gold:#c9a24a; --line:#ecdcc9;
  --hero-a:#5a0f26; --hero-b:#8b1e3f; --hero-ink:#fff6e6;
}
[data-theme="coastal"]{
  --bg:#f4fbf8; --surface:#ffffff; --ink:#123b36; --muted:#4f6f69;
  --primary:#0f766e; --primary-ink:#fff; --gold:#d4a017; --line:#d6ebe4;
  --hero-a:#0b4f4a; --hero-b:#0f766e; --hero-ink:#fffdf3;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;line-height:1.6}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;margin:0 0 .4em;line-height:1.15}
.script{font-family:"Great Vibes",cursive;font-weight:400}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:18px;overflow-x:auto;height:52px;align-items:center;white-space:nowrap}
nav a{color:var(--muted);text-decoration:none;font-size:.92rem;font-weight:500}
nav a:hover{color:var(--primary)}
.hero{background:radial-gradient(ellipse at top,var(--hero-b),var(--hero-a));color:var(--hero-ink);text-align:center;padding:80px 20px 70px;position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;width:340px;height:340px;border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:50%;top:-120px;left:-120px}
.hero:after{top:auto;left:auto;bottom:-140px;right:-120px}
.hero .pre{letter-spacing:.3em;text-transform:uppercase;font-size:.8rem;opacity:.85}
.hero h1{font-size:clamp(3rem,10vw,5.6rem);margin:.15em 0;color:var(--hero-ink)}
.hero .date{font-size:1.15rem;letter-spacing:.08em}
.hero .place{opacity:.85}
.count{display:flex;justify-content:center;gap:14px;margin-top:28px;flex-wrap:wrap}
.count div{background:rgba(255,255,255,.1);border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);border-radius:12px;padding:10px 14px;min-width:76px}
.count b{display:block;font-family:"Cormorant Garamond",serif;font-size:2rem;line-height:1}
.count span{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.btn{display:inline-block;background:var(--gold);color:#2a1a0a;padding:12px 26px;border-radius:99px;text-decoration:none;font-weight:600;margin-top:26px;border:0;cursor:pointer;font:inherit;font-weight:600}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
section{padding:60px 0}
.title{text-align:center;margin-bottom:30px}
.title h2{font-size:clamp(2rem,5vw,2.8rem);color:var(--primary)}
.title p{color:var(--muted);margin:0}
.divider{width:80px;height:2px;background:var(--gold);margin:10px auto 0}
.story{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.story .art{aspect-ratio:4/5;border-radius:200px 200px 16px 16px;background:linear-gradient(160deg,var(--hero-b),var(--hero-a));display:grid;place-items:center;color:var(--hero-ink);font-size:4.5rem;border:6px solid var(--surface);box-shadow:0 0 0 1px var(--gold)}
.story p{color:var(--muted);font-size:1.05rem}
.events{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.event{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;position:relative;overflow:hidden}
.event:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--gold),var(--primary))}
.event .emoji{font-size:2rem}
.event h3{font-size:1.7rem;color:var(--primary);margin-top:6px}
.event .when{font-weight:600}
.event .where{color:var(--muted)}
.event .dress{margin-top:12px;font-size:.92rem;background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:10px;padding:8px 12px}
.event .links{margin-top:14px;display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem}
.event .links a{color:var(--primary);font-weight:600}
.alt{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.info{border:1px solid var(--line);border-radius:16px;padding:20px;background:var(--bg)}
.info h3{color:var(--primary);font-size:1.4rem}
.info p{margin:.2em 0;color:var(--muted)}
.info a{color:var(--primary);font-weight:600}
form{max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px}
label{display:block;font-weight:600;font-size:.92rem;margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.checks label{font-weight:400;margin:0;display:flex;gap:8px;align-items:center}
.checks input{width:auto}
.note{font-size:.85rem;color:var(--muted);text-align:center;margin-top:12px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:0 auto 10px;max-width:760px}
summary{cursor:pointer;font-weight:600}
details p{color:var(--muted);margin:.5em 0 0}
footer{text-align:center;padding:40px 20px;color:var(--muted);font-size:.9rem}
footer .script{font-size:2.2rem;color:var(--primary)}
.credit{margin-top:14px;font-size:.8rem;opacity:.75}
.credit a{color:inherit}
@media (max-width:720px){.story{grid-template-columns:1fr}.story .art{max-width:260px;margin:0 auto}section{padding:44px 0}}
</style>
</head>
<body>
<nav><div class="wrap">
  <a href="#story">Our Story</a><a href="#events">Events</a><a href="#travel">Travel & Stay</a><a href="#rsvp">RSVP</a><a href="#faq">FAQ</a>
</div></nav>

<header class="hero">
  <div class="pre" id="hPre"></div>
  <h1 class="script" id="hNames"></h1>
  <div class="date" id="hDate"></div>
  <div class="place" id="hPlace"></div>
  <div class="count" id="count"></div>
  <a class="btn" href="#rsvp">RSVP now</a>
</header>

<main>
<section id="story"><div class="wrap story">
  <div class="art" id="storyArt"></div>
  <div>
    <h2 style="font-size:2.4rem;color:var(--primary)">Our Story</h2>
    <div id="storyText"></div>
  </div>
</div></section>

<section id="events" class="alt"><div class="wrap">
  <div class="title"><h2>The Celebrations</h2><p id="evSub"></p><div class="divider"></div></div>
  <div class="events" id="eventList"></div>
</div></section>

<section id="travel"><div class="wrap">
  <div class="title"><h2>Travel & Stay</h2><p>Everything you need to reach us</p><div class="divider"></div></div>
  <div class="grid2" id="travelList"></div>
</div></section>

<section id="rsvp" class="alt"><div class="wrap">
  <div class="title"><h2>RSVP</h2><p id="rsvpBy"></p><div class="divider"></div></div>
  <form id="rsvpForm">
    <label for="fName">Your name(s)</label>
    <input id="fName" required placeholder="e.g. Rohan & Priya Mehta">
    <label for="fCount">How many guests including you?</label>
    <select id="fCount"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6+</option></select>
    <label>Which events will you attend?</label>
    <div class="checks" id="fEvents"></div>
    <label for="fMeal">Meal preference</label>
    <select id="fMeal"><option>Vegetarian</option><option>Jain</option><option>Non-vegetarian</option><option>Vegan</option></select>
    <label for="fArrive">Arrival date & mode (helps us plan pickups)</label>
    <input id="fArrive" placeholder="e.g. 12 Dec, flight AI-471 landing 2:30 pm">
    <label for="fRoom">Need a room in the guest hotel?</label>
    <select id="fRoom"><option>Yes</option><option>No, staying elsewhere</option></select>
    <label for="fMsg">A message for the couple (optional)</label>
    <textarea id="fMsg" rows="3"></textarea>
    <div style="text-align:center"><button class="btn primary" type="submit">Send RSVP on WhatsApp</button></div>
    <p class="note" id="rsvpNote"></p>
  </form>
</div></section>

<section id="faq"><div class="wrap">
  <div class="title"><h2>Good to Know</h2><div class="divider"></div></div>
  <div id="faqList"></div>
</div></section>
</main>

<footer>
  <div class="script" id="fNames"></div>
  <div id="fHash"></div>
  <div class="credit" id="credit"></div>
</footer>

<script>
const W = window.WEDDING;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.documentElement.dataset.theme = W.theme || 'royal';
document.title = `${W.bride} & ${W.groom} | ${W.dateText}`;

$('hPre').textContent = W.tagline;
$('hNames').textContent = `${W.bride} & ${W.groom}`;
$('hDate').textContent = W.dateText;
$('hPlace').textContent = W.place;
$('storyArt').textContent = W.storyEmoji || '💍';
$('storyText').innerHTML = W.story.map(p => `<p>${esc(p)}</p>`).join('');
$('evSub').textContent = `${W.events.length} celebrations · ${W.place}`;
$('rsvpBy').textContent = `Kindly respond by ${W.rsvpBy}`;
$('fNames').textContent = `${W.bride} & ${W.groom}`;
$('fHash').textContent = W.hashtag || '';
$('credit').innerHTML = W.credit ? `Website by <a href="${esc(W.credit.url)}">${esc(W.credit.name)}</a>` : '';

// countdown
function tick(){
  const ms = new Date(W.mainDateISO) - new Date();
  if (ms <= 0){ $('count').innerHTML = '<div><b>💛</b><span>Married!</span></div>'; return; }
  const d = Math.floor(ms/864e5), h = Math.floor(ms/36e5)%24, m = Math.floor(ms/6e4)%60;
  $('count').innerHTML = [[d,'Days'],[h,'Hours'],[m,'Minutes']].map(([n,l]) => `<div><b>${n}</b><span>${l}</span></div>`).join('');
}
tick(); setInterval(tick, 30000);

// events
const gcal = e => {
  const f = s => s.replace(/[-:]/g,'').slice(0,15);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(`${e.name}: ${W.bride} & ${W.groom}`)
    + '&dates=' + f(e.startISO) + '/' + f(e.endISO)
    + '&location=' + encodeURIComponent(e.venue);
};
$('eventList').innerHTML = W.events.map(e => `
  <article class="event">
    <div class="emoji">${e.emoji}</div>
    <h3>${esc(e.name)}</h3>
    <div class="when">${esc(e.when)}</div>
    <div class="where">${esc(e.venue)}</div>
    ${e.note ? `<p style="margin:.6em 0 0">${esc(e.note)}</p>` : ''}
    <div class="dress">👗 <strong>Dress code:</strong> ${esc(e.dress)}</div>
    <div class="links">
      <a href="${esc(e.mapUrl)}" target="_blank" rel="noopener">📍 Directions</a>
      <a href="${gcal(e)}" target="_blank" rel="noopener">📅 Add to calendar</a>
    </div>
  </article>`).join('');
$('fEvents').innerHTML = W.events.map((e,i) => `<label><input type="checkbox" value="${esc(e.name)}" checked> ${esc(e.name)}</label>`).join('');

// travel
$('travelList').innerHTML = W.travel.map(t => `
  <div class="info"><h3>${t.emoji} ${esc(t.title)}</h3>
  ${t.lines.map(l => `<p>${esc(l)}</p>`).join('')}
  ${t.link ? `<p><a href="${esc(t.link.url)}" target="_blank" rel="noopener">${esc(t.link.text)} →</a></p>` : ''}</div>`).join('');

// faq
$('faqList').innerHTML = W.faq.map(([q,a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('');

// RSVP → WhatsApp message to host (no server needed). Optional Google Form link.
$('rsvpNote').innerHTML = `Opens WhatsApp with your RSVP ready to send to ${esc(W.rsvpContactName)}.`
  + (W.googleFormUrl ? ` Prefer a form? <a href="${esc(W.googleFormUrl)}" target="_blank" rel="noopener">Use this one</a>.` : '');
$('rsvpForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const events = [...document.querySelectorAll('#fEvents input:checked')].map(i => i.value).join(', ') || 'None';
  const msg = `RSVP for ${W.bride} & ${W.groom}'s wedding 💌
Name: ${$('fName').value}
Guests: ${$('fCount').value}
Events: ${events}
Meal: ${$('fMeal').value}
Arrival: ${$('fArrive').value || '-'}
Hotel room needed: ${$('fRoom').value}
Message: ${$('fMsg').value || '-'}`;
  window.open('https://wa.me/' + W.rsvpWhatsapp + '?text=' + encodeURIComponent(msg), '_blank', 'noopener');
});
</script>
</body>
</html>
